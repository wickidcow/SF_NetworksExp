name: Apply directional permission hardening

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/apply-directional-permission-hardening.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Networks
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply reviewed Networks fork hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/java/io/github/sefiraat/networks/slimefun/network/NetworkDirectional.java')
          text = path.read_text()

          old_can_open = '''return player.hasPermission("slimefun.inventory.bypass")
                    || (this.getSlimefunItem().canUse(player, false)
                    && Slimefun.getProtectionManager()
                    .hasPermission(player, block.getLocation(), Interaction.INTERACT_BLOCK));'''
          new_can_open = '''return player.hasPermission("slimefun.inventory.bypass")
                    || (NetworkDirectional.this.canUse(player, false)
                    && Slimefun.getProtectionManager()
                    .hasPermission(player, block.getLocation(), Interaction.INTERACT_BLOCK));'''
          if old_can_open not in text:
              raise SystemExit('Expected directional canOpen block was not found')
          text = text.replace(old_can_open, new_can_open, 1)

          old_target = '''if (item != null
                && item.canUse(player, true)
                && Slimefun.getProtectionManager()
                .hasPermission(player, blockMenu.getLocation(), Interaction.INTERACT_BLOCK)) {
                targetMenu.open(player);
            }'''
          new_target = '''if (item != null
                && (player.hasPermission("slimefun.inventory.bypass") || item.canUse(player, true))
                && (player.hasPermission("slimefun.inventory.bypass")
                || Slimefun.getProtectionManager()
                .hasPermission(player, location, Interaction.INTERACT_BLOCK))) {
                targetMenu.open(player);
            }'''
          if old_target not in text:
              raise SystemExit('Expected directional target-open block was not found')
          text = text.replace(old_target, new_target, 1)

          path.write_text(text)
          PY

      - name: Verify Networks source contract
        run: python3 scripts/verify_legacy_compatibility.py

      - name: Commit hardening and remove applicator
        shell: bash
        run: |
          rm .github/workflows/apply-directional-permission-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/io/github/sefiraat/networks/slimefun/network/NetworkDirectional.java .github/workflows/apply-directional-permission-hardening.yml
          git commit -m 'Harden directional target permissions'
          git push origin HEAD:master
