name: Build Networks Universal

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

env:
  LEGACY_ARTIFACT_VERSION: "1.0.19"
  OUTPUT_NAME: "SF_NetworksExp1.0.19.jar"

# Gradle's internal runtime-contract output remains Networks-Legacy-2.1.112-1.0.jar.
# CI stages that JAR under the public Slimefun Legacy addon release naming convention.

jobs:
  compatibility:
    name: Gate universal release on all supported cores
    uses: ./.github/workflows/compatibility.yml

  build:
    name: Build Networks Legacy JAR
    needs: compatibility
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check out Networks
        uses: actions/checkout@v6
      - name: Check out Slimefun Legacy
        uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: master
          path: .ci/slimefun-core
      - name: Record release core revision
        shell: bash
        run: |
          {
            echo "Universal release compiler: Slimefun Legacy"
            echo "Repository: wickidcow/Slimefun-Legacy"
            echo "Branch: master"
            echo "Commit: $(git -C .ci/slimefun-core rev-parse HEAD)"
          } | tee compatibility-manifest.txt
          cat compatibility-manifest.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Java 25 for Slimefun Legacy
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Verify Networks source contract
        run: python3 scripts/verify_legacy_compatibility.py
      - name: Build exact Slimefun Legacy JAR
        shell: bash
        run: bash scripts/build_slimefun_core.sh .ci/slimefun-core legacy
      - name: Locate exact Slimefun Legacy JAR
        shell: bash
        run: |
          CORE_JAR="$(python3 scripts/find_slimefun_jar.py .ci/slimefun-core)"
          test -f "$CORE_JAR"
          echo "SLIMEFUN_CORE_JAR=$CORE_JAR" >> "$GITHUB_ENV"
      - name: Set up Java 21 for Networks
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build and test Networks
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon -PslimefunCoreJar="$SLIMEFUN_CORE_JAR"
      - name: Locate universal Networks JAR
        shell: bash
        run: |
          NETWORKS_JAR="$(find build/libs -name 'Networks-Legacy-*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$NETWORKS_JAR"
          echo "NETWORKS_JAR=$NETWORKS_JAR" >> "$GITHUB_ENV"
      - name: Verify Java 21 bytecode
        run: python3 scripts/verify_java21_bytecode.py "$NETWORKS_JAR"
      - name: Verify universal JAR contents
        run: python3 scripts/verify_universal_jar.py "$NETWORKS_JAR" "2.1.112-Legacy-1.0"
      - name: Stage versioned JAR
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp "$NETWORKS_JAR" "dist/${OUTPUT_NAME}"
          test -s "dist/${OUTPUT_NAME}"
          sha256sum "dist/${OUTPUT_NAME}"
      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error
      - name: Publish raw JAR release asset
        if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch) && needs.compatibility.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v${LEGACY_ARTIFACT_VERSION}"; fi
          JAR="dist/${OUTPUT_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --title "SF_NetworksExp $TAG" --notes "Networks Legacy 1.0.19 ports the useful functional changes from upstream NetworksExpansion 2.1.121 while preserving this fork's safer transfer and compatibility work. It adds P2P Specified Quantity transport mode, which keeps each P2P destination slot at the quantity encoded by its corresponding template and routes withdrawals through the existing rollback-safe NetworkTransferUtils path. Item matching now checks lore requirements from either side of a comparison, including the modern data-component path, reducing incorrect matches for custom and Slimefun items. Minecraft 1.21.3 colored bundles are explicitly recognized by the transfer blacklist. The unrelated upstream Chinese announcement and author-guide restructuring is intentionally not imported. Existing Slimefun Legacy, United and Gugu compatibility, Java 21 output, InfinityExpansion2 support, anti-duplication safeguards, pusher performance fixes and Network Recipe Encoder collision fixes remain intact."
          fi
