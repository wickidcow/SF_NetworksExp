name: Build Networks Universal

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

env:
  LEGACY_ARTIFACT_VERSION: "1.0.16"
  OUTPUT_NAME: "SF_NetworksExp1.0.16.jar"

# Gradle's internal runtime-contract output remains Networks-Legacy-2.1.112-1.0.jar.
# CI stages that JAR under the public Slimefun Legacy addon release naming convention.

jobs:
  audit_format_patch:
    name: Apply one-time audit formatting cleanup
    if: github.event_name == 'push' && github.event.head_commit.message == 'Bootstrap audit formatting cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v6
        with:
          ref: audit/server-scale-phase1
          fetch-depth: 0
          persist-credentials: true

      - name: Normalize audit code formatting and comments
        shell: python
        run: |
          from pathlib import Path

          root_path = Path('src/main/java/io/github/sefiraat/networks/network/NetworkRoot.java')
          root = root_path.read_text()

          view_start_marker = '    /**\n * Invalidates storage-derived views without immediately rescanning every monitor.'
          view_end_marker = '    @Nullable\n    public BarrelIdentity accessInputAbleBarrel'
          start = root.find(view_start_marker)
          end = root.find(view_end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Storage-view formatting anchors not found')
          formatted_views = '''    /**
           * Invalidates storage-derived views without immediately rescanning every monitor. A newly-created
           * NetworkRoot starts with these views empty as well, so stable-root reuse should return to that same
           * lazy state and let the next real storage operation rebuild only the view it actually needs.
           */
          public void invalidateRootItems() {
              this.barrels = null;
              this.cargoStorageUnitDatas = null;
              this.inputAbleBarrels = null;
              this.outputAbleBarrels = null;
              this.inputAbleCargoStorageUnitDatas = null;
              this.outputAbleCargoStorageUnitDatas = null;
              this.mapInputAbleBarrels = null;
              this.mapOutputAbleBarrels = null;
              this.mapInputAbleCargoStorageUnits = null;
              this.mapOutputAbleCargoStorageUnits = null;
              this.allItemsView = null;
          }

          public boolean refreshRootItems() {
              invalidateRootItems();

              getBarrels();
              getCargoStorageUnitDatas();
              getInputAbleBarrels();
              getOutputAbleBarrels();
              getInputAbleCargoStorageUnitDatas();
              getOutputAbleCargoStorageUnitDatas();
              return true;
          }

          '''
          root = root[:start] + formatted_views + root[end:]

          power_start_marker = '                powerNode.removeCharge(node, toRemove);\n'
          power_end_marker = '                removed = removed + toRemove;\n'
          start = root.find(power_start_marker)
          end = root.find(power_end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Root-power formatting anchors not found')
          formatted_power = '''                powerNode.removeCharge(node, toRemove);
                  // Only subtract the charge actually removed from this node. Subtracting the full
                  // request once per power node could drive the root total negative when one request spans nodes.
                  this.rootPower -= toRemove;
          '''
          root = root[:start] + formatted_power + root[end:]
          root_path.write_text(root)

          controller_path = Path('src/main/java/io/github/sefiraat/networks/slimefun/network/NetworkController.java')
          controller = controller_path.read_text()
          doc_start_marker = '    /**\n     * Refreshes the state that the old per-tick root reconstruction implicitly refreshed'
          method_marker = '    private static void refreshStableRoot(@NotNull NetworkRoot root, @NotNull Location controllerLocation) {'
          start = controller.find(doc_start_marker)
          method = controller.find(method_marker, start)
          if start < 0 or method < 0:
              raise SystemExit('Stable-root documentation anchors not found')
          new_doc = '''    /**
           * Refreshes dynamic state without rebuilding the topology object graph. Power is re-summed from live power
           * nodes, while storage-derived views are invalidated back to a fresh root's lazy state before the ready event.
           */
          '''
          controller = controller[:start] + new_doc + controller[method:]

          set_marker = '        root.setDisplayParticles(CRAYONS.contains(controllerLocation));\n'
          next_method_marker = '\n    /**\n     * Rebuilds a replacement NetworkRoot object'
          start = controller.find(set_marker, controller.find(method_marker))
          end = controller.find(next_method_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Stable-root body anchors not found')
          stable_tail = '''        root.setDisplayParticles(CRAYONS.contains(controllerLocation));
                  // A fresh root leaves storage-derived views lazy. Stable reuse should do the same instead of
                  // rescanning every monitor in every direction on every unchanged controller tick.
                  root.invalidateRootItems();
              }
          '''
          controller = controller[:start] + stable_tail + controller[end:]
          controller_path.write_text(controller)

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name wickidcow
          git config user.email jaywago@gmail.com
          git add src/main/java/io/github/sefiraat/networks/network/NetworkRoot.java \
            src/main/java/io/github/sefiraat/networks/slimefun/network/NetworkController.java
          git commit -m "Clean up stable-root audit formatting"
          git push origin HEAD:audit/server-scale-phase1

  compatibility:
    name: Gate universal release on all supported cores
    uses: ./.github/workflows/compatibility.yml

  build:
    name: Build Networks Legacy JAR
    needs: compatibility
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check out Networks
        uses: actions/checkout@v6
      - name: Check out Slimefun Legacy
        uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: master
          path: .ci/slimefun-core
      - name: Record release core revision
        shell: bash
        run: |
          {
            echo "Universal release compiler: Slimefun Legacy"
            echo "Repository: wickidcow/Slimefun-Legacy"
            echo "Branch: master"
            echo "Commit: $(git -C .ci/slimefun-core rev-parse HEAD)"
          } | tee compatibility-manifest.txt
          cat compatibility-manifest.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Java 25 for Slimefun Legacy
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Verify Networks source contract
        run: python3 scripts/verify_legacy_compatibility.py
      - name: Build exact Slimefun Legacy JAR
        shell: bash
        run: bash scripts/build_slimefun_core.sh .ci/slimefun-core legacy
      - name: Locate exact Slimefun Legacy JAR
        shell: bash
        run: |
          CORE_JAR="$(python3 scripts/find_slimefun_jar.py .ci/slimefun-core)"
          test -f "$CORE_JAR"
          echo "SLIMEFUN_CORE_JAR=$CORE_JAR" >> "$GITHUB_ENV"
      - name: Set up Java 21 for Networks
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build and test Networks
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon -PslimefunCoreJar="$SLIMEFUN_CORE_JAR"
      - name: Locate universal Networks JAR
        shell: bash
        run: |
          NETWORKS_JAR="$(find build/libs -name 'Networks-Legacy-*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$NETWORKS_JAR"
          echo "NETWORKS_JAR=$NETWORKS_JAR" >> "$GITHUB_ENV"
      - name: Verify Java 21 bytecode
        run: python3 scripts/verify_java21_bytecode.py "$NETWORKS_JAR"
      - name: Verify universal JAR contents
        run: python3 scripts/verify_universal_jar.py "$NETWORKS_JAR" "2.1.112-Legacy-1.0"
      - name: Stage versioned JAR
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp "$NETWORKS_JAR" "dist/${OUTPUT_NAME}"
          test -s "dist/${OUTPUT_NAME}"
          sha256sum "dist/${OUTPUT_NAME}"
      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error
      - name: Publish raw JAR release asset
        if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch) && needs.compatibility.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v${LEGACY_ARTIFACT_VERSION}"; fi
          JAR="dist/${OUTPUT_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --title "SF_NetworksExp $TAG" --notes "Networks Legacy 1.0.16 adds adaptive failed-transfer backoff to Network Pushers. If a destination has no valid insert slot or a transfer moves zero items, that exact source/destination/item request waits briefly before retrying, increasing from 4 to 8 to 16 and then at most 20 ticks while the failure continues. Successful transfers clear the backoff immediately, and cooling requests do not consume the four-request per-tick budget, so other ingredients remain responsive. This further reduces repeated expensive destination checks against item-aware machines such as Supreme Electric Magical Fabricators while preserving successful transfer throughput, item IDs, world data, database formats, anti-duplication protections, IE2 integration, the 1.0.15 pusher batching, and the 1.0.14 Expansion toggle."
          fi
