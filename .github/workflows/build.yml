name: Build Networks Legacy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Networks Legacy
        uses: actions/checkout@v6

      - name: Check out Slimefun Legacy
        uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: master
          path: .ci/slimefun-legacy

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Verify Networks compatibility contract
        run: python3 scripts/verify_legacy_compatibility.py

      - name: Build exact Slimefun Legacy JAR
        working-directory: .ci/slimefun-legacy
        run: |
          chmod +x gradlew
          python3 scripts/verify_legacy.py .
          ./gradlew spotlessApply --no-daemon
          ./gradlew clean build --no-daemon

      - name: Build Networks against Slimefun Legacy
        shell: bash
        run: |
          chmod +x gradlew
          SLIMEFUN_JAR="$(find .ci/slimefun-legacy/build/libs -name 'Slimefun-*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$SLIMEFUN_JAR"
          ./gradlew clean build --no-daemon -PslimefunLegacyJar="$PWD/$SLIMEFUN_JAR"

      - name: Verify Java 21 bytecode
        shell: bash
        run: |
          NETWORKS_JAR="$(find build/libs -name 'Networks-Legacy-*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$NETWORKS_JAR"
          python3 scripts/verify_java21_bytecode.py "$NETWORKS_JAR"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: Networks-Legacy-Alpha1
          path: build/libs/Networks-Legacy-*.jar
          if-no-files-found: error
