name: Build Networks Universal

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Gate universal release on all supported cores
    uses: ./.github/workflows/compatibility.yml

  build:
    name: Build universal Networks JAR
    needs: compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Check out Networks
        uses: actions/checkout@v6

      - name: Check out Slimefun Legacy
        uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: master
          path: .ci/slimefun-core

      - name: Record release core revision
        shell: bash
        run: |
          {
            echo "Universal release compiler: Slimefun Legacy"
            echo "Repository: wickidcow/Slimefun-Legacy"
            echo "Branch: master"
            echo "Commit: $(git -C .ci/slimefun-core rev-parse HEAD)"
          } | tee compatibility-manifest.txt

      - name: Set up Java 25 for Slimefun Legacy
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Verify Networks source contract
        run: python3 scripts/verify_legacy_compatibility.py

      - name: Build exact Slimefun Legacy JAR
        shell: bash
        run: bash scripts/build_slimefun_core.sh .ci/slimefun-core legacy

      - name: Locate exact Slimefun Legacy JAR
        shell: bash
        run: |
          CORE_JAR="$(python3 scripts/find_slimefun_jar.py .ci/slimefun-core)"
          test -f "$CORE_JAR"
          echo "SLIMEFUN_CORE_JAR=$CORE_JAR" >> "$GITHUB_ENV"
          echo "Using Slimefun core: $CORE_JAR"

      - name: Set up Java 21 for Networks
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build and test Networks
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon -PslimefunCoreJar="$SLIMEFUN_CORE_JAR"

      - name: Locate universal Networks JAR
        shell: bash
        run: |
          NETWORKS_JAR="$(find build/libs -name 'Networks-Legacy-*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$NETWORKS_JAR"
          echo "NETWORKS_JAR=$NETWORKS_JAR" >> "$GITHUB_ENV"
          echo "Built universal Networks JAR: $NETWORKS_JAR"

      - name: Verify Java 21 bytecode
        run: python3 scripts/verify_java21_bytecode.py "$NETWORKS_JAR"

      - name: Verify universal JAR contents
        run: python3 scripts/verify_universal_jar.py "$NETWORKS_JAR" "2.1.112-Legacy-Alpha3"

      - name: Upload universal Networks JAR
        uses: actions/upload-artifact@v7
        with:
          name: Networks-Legacy-Alpha3-Universal
          path: |
            ${{ env.NETWORKS_JAR }}
            compatibility-manifest.txt
          if-no-files-found: error
