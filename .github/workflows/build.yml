name: Build Networks Compatibility Matrix

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: ${{ matrix.display }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: legacy
            display: Slimefun Legacy (primary)
            repository: wickidcow/Slimefun-Legacy
            ref: master
            core_java: "25"
            cache: gradle
          - key: united
            display: Slimefun United
            repository: Slimefun-United/Slimefun-United
            ref: dev
            core_java: "21"
            cache: maven
          - key: gugu
            display: Slimefun Gugu
            repository: SlimefunGuguProject/Slimefun4
            ref: master
            core_java: "21"
            cache: gradle

    steps:
      - name: Check out Networks
        uses: actions/checkout@v6

      - name: Check out ${{ matrix.display }}
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: .ci/slimefun-core

      - name: Set up Java ${{ matrix.core_java }} for the Slimefun core
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.core_java }}
          cache: ${{ matrix.cache }}

      - name: Verify Networks source contract
        run: python3 scripts/verify_legacy_compatibility.py

      - name: Build exact ${{ matrix.display }} JAR
        shell: bash
        run: scripts/build_slimefun_core.sh .ci/slimefun-core "${{ matrix.key }}"

      - name: Locate exact Slimefun core JAR
        shell: bash
        run: |
          CORE_JAR="$(python3 scripts/find_slimefun_jar.py .ci/slimefun-core)"
          test -f "$CORE_JAR"
          echo "SLIMEFUN_CORE_JAR=$CORE_JAR" >> "$GITHUB_ENV"
          echo "Using Slimefun core: $CORE_JAR"

      - name: Set up Java 21 for Networks
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build Networks against ${{ matrix.display }}
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon -PslimefunCoreJar="$SLIMEFUN_CORE_JAR"

      - name: Verify Java 21 bytecode
        shell: bash
        run: |
          NETWORKS_JAR="$(find build/libs -name 'Networks-Legacy-*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$NETWORKS_JAR"
          python3 scripts/verify_java21_bytecode.py "$NETWORKS_JAR"

      - name: Upload ${{ matrix.display }} artifact
        uses: actions/upload-artifact@v7
        with:
          name: Networks-Alpha2-${{ matrix.key }}
          path: build/libs/Networks-Legacy-*.jar
          if-no-files-found: error
