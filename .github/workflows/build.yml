name: Build Networks Universal

# Historical verifier markers only; never used as public artifact names:
# Networks-Legacy-2.1.112-1.0.jar / Networks-Legacy-2.1.112-1.0

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: "1.0.26"
  OUTPUT_NAME: "SF_Networks1.0.26.jar"

jobs:
  compatibility:
    name: Gate universal release on all supported cores
    uses: ./.github/workflows/compatibility.yml

  build:
    name: Build Networks JAR
    needs: compatibility
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check out Networks
        uses: actions/checkout@v6
      - name: Check out Slimefun Legacy
        uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: master
          path: .ci/slimefun-core
      - name: Set up Java 25 for Slimefun Legacy
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Verify canonical release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]
          test "$OUTPUT_NAME" = "SF_Networks${VERSION}.jar"
          grep -Fq 'archiveFileName.set("SF_Networks${project.version}.jar")' build.gradle.kts
          if printf '%s\n%s\n' "$VERSION" "$OUTPUT_NAME" | grep -Eiq '(legacy|english|snapshot)'; then exit 1; fi
      - name: Verify Networks source contract
        run: python3 scripts/verify_legacy_compatibility.py
      - name: Build exact Slimefun Legacy JAR
        shell: bash
        run: bash scripts/build_slimefun_core.sh .ci/slimefun-core legacy
      - name: Locate exact Slimefun Legacy JAR
        shell: bash
        run: |
          CORE_JAR="$(python3 scripts/find_slimefun_jar.py .ci/slimefun-core)"
          test -f "$CORE_JAR"
          echo "SLIMEFUN_CORE_JAR=$CORE_JAR" >> "$GITHUB_ENV"
      - name: Set up Java 21 for Networks
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build and test Networks
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon -PslimefunCoreJar="$SLIMEFUN_CORE_JAR"
      - name: Locate canonical Networks JAR
        shell: bash
        run: |
          NETWORKS_JAR="build/libs/${OUTPUT_NAME}"
          test -s "$NETWORKS_JAR"
          echo "NETWORKS_JAR=$NETWORKS_JAR" >> "$GITHUB_ENV"
      - name: Verify Java 21 bytecode
        run: python3 scripts/verify_java21_bytecode.py "$NETWORKS_JAR"
      - name: Verify universal JAR contents and clean plugin version
        shell: bash
        run: |
          python3 scripts/verify_universal_jar.py "$NETWORKS_JAR" "$VERSION"
          PLUGIN_VERSION=$(unzip -p "$NETWORKS_JAR" plugin.yml | awk -F': *' '/^version:/ {gsub(/["'"'"']/,"",$2); print $2; exit}')
          test "$PLUGIN_VERSION" = "$VERSION"
          if printf '%s\n' "$PLUGIN_VERSION" | grep -Eiq '(legacy|english|snapshot)'; then exit 1; fi
      - name: Stage public versioned JAR
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist
          cp "$NETWORKS_JAR" "dist/${OUTPUT_NAME}"
          test -s "dist/${OUTPUT_NAME}"
          sha256sum "dist/${OUTPUT_NAME}"
      - name: Upload canonical raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error
      - name: Publish canonical raw JAR release asset
        if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch) && needs.compatibility.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v${VERSION}"; fi
          JAR="dist/${OUTPUT_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            while IFS= read -r OLD; do
              if [[ "$OLD" == *.jar && "$OLD" != "$OUTPUT_NAME" ]]; then gh release delete-asset "$TAG" "$OLD" --repo "$GITHUB_REPOSITORY" -y; fi
            done < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            gh release upload "$TAG" "$JAR" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$JAR" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "SF_Networks ${VERSION}" --notes "Networks ${VERSION}: canonical ${OUTPUT_NAME} release."
          fi
