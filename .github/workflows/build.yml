name: Refork Repair Runner

on:
  push:
    branches:
      - refork-merge

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: refork-merge
          fetch-depth: 0

      - name: Repair merge artifacts and restore CI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin legacy-1.0.2-pre-refork

          git checkout origin/legacy-1.0.2-pre-refork -- \
            .github/workflows/build.yml \
            src/main/java/com/balugaq/netex/utils/InventoryUtil.java \
            src/main/java/io/github/sefiraat/networks/network/stackcaches/QuantumCache.java

          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main/java/io/github/sefiraat/networks/network/NetworkRoot.java')
          text = path.read_text()
          method_start = text.index('    public Map<ItemStack, Long> getAllNetworkItemsLongType() {')
          method_end = text.index('        for (BlockMenu blockMenu : getCrafterOutputs()) {', method_start)
          region = text[method_start:method_end]
          old_a = "        for (BlockMenu blockMenu : getAdvancedGreedyBlockMenus()) {\n            int[] slots = BlockMenuUtil.getSafeTransportSlots(blockMenu, ItemTransportFlow.WITHDRAW);\n"
          new_a = "        for (BlockMenu blockMenu : getAdvancedGreedyBlockMenus()) {\n            final ItemStack template = blockMenu.getItemInSlot(AdvancedGreedyBlock.TEMPLATE_SLOT);\n            if (template == null || template.getType() == Material.AIR) {\n                continue;\n            }\n            int[] slots = BlockMenuUtil.getSafeTransportSlots(blockMenu, ItemTransportFlow.WITHDRAW);\n"
          old_g = "        for (BlockMenu blockMenu : getGreedyBlockMenus()) {\n            int[] slots = BlockMenuUtil.getSafeTransportSlots(blockMenu, ItemTransportFlow.WITHDRAW);\n            if (slots.length == 0) {\n"
          new_g = "        for (BlockMenu blockMenu : getGreedyBlockMenus()) {\n            final ItemStack template = blockMenu.getItemInSlot(NetworkGreedyBlock.TEMPLATE_SLOT);\n            if (template == null || template.getType() == Material.AIR) {\n                continue;\n            }\n            int[] slots = BlockMenuUtil.getSafeTransportSlots(blockMenu, ItemTransportFlow.WITHDRAW);\n            if (slots.length == 0) {\n"
          assert region.count(old_a) == 1, region.count(old_a)
          assert region.count(old_g) == 1, region.count(old_g)
          region = region.replace(old_a, new_a, 1).replace(old_g, new_g, 1)
          path.write_text(text[:method_start] + region + text[method_end:])
          PY

          rm -f .github/workflows/refork-repair.yml .refork-trigger
          git diff --check
          grep -q 'return result;' src/main/java/com/balugaq/netex/utils/InventoryUtil.java
          test "$(grep -c 'public synchronized ItemStack getItemStack()' src/main/java/io/github/sefiraat/networks/network/stackcaches/QuantumCache.java)" -eq 1
          grep -q 'AdvancedGreedyBlock.TEMPLATE_SLOT' src/main/java/io/github/sefiraat/networks/network/NetworkRoot.java
          grep -q 'NetworkGreedyBlock.TEMPLATE_SLOT' src/main/java/io/github/sefiraat/networks/network/NetworkRoot.java

          git add -A
          git commit -m "fix(refork): resolve upstream merge compile artifacts"
          git push origin HEAD:refork-merge
