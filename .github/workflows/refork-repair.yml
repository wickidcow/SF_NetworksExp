name: Refork Compile Repair

on:
  push:
    branches:
      - refork-merge
    paths:
      - '.github/workflows/refork-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: refork-merge
          fetch-depth: 0

      - name: Repair merge artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin legacy-1.0.2-pre-refork

          # Preserve the fork's known-good transaction/remainder semantics and quantum hardening.
          git checkout origin/legacy-1.0.2-pre-refork -- \
            src/main/java/com/balugaq/netex/utils/InventoryUtil.java \
            src/main/java/io/github/sefiraat/networks/network/stackcaches/QuantumCache.java

          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/java/io/github/sefiraat/networks/network/NetworkRoot.java')
          text = path.read_text()

          old_advanced = '''        for (BlockMenu blockMenu : getAdvancedGreedyBlockMenus()) {
            int[] slots = BlockMenuUtil.getSafeTransportSlots(blockMenu, ItemTransportFlow.WITHDRAW);
'''
          new_advanced = '''        for (BlockMenu blockMenu : getAdvancedGreedyBlockMenus()) {
            final ItemStack template = blockMenu.getItemInSlot(AdvancedGreedyBlock.TEMPLATE_SLOT);
            if (template == null || template.getType() == Material.AIR) {
                continue;
            }
            int[] slots = BlockMenuUtil.getSafeTransportSlots(blockMenu, ItemTransportFlow.WITHDRAW);
'''

          old_greedy = '''        for (BlockMenu blockMenu : getGreedyBlockMenus()) {
            int[] slots = BlockMenuUtil.getSafeTransportSlots(blockMenu, ItemTransportFlow.WITHDRAW);
            if (slots.length == 0) {
'''
          new_greedy = '''        for (BlockMenu blockMenu : getGreedyBlockMenus()) {
            final ItemStack template = blockMenu.getItemInSlot(NetworkGreedyBlock.TEMPLATE_SLOT);
            if (template == null || template.getType() == Material.AIR) {
                continue;
            }
            int[] slots = BlockMenuUtil.getSafeTransportSlots(blockMenu, ItemTransportFlow.WITHDRAW);
            if (slots.length == 0) {
'''

          if text.count(old_advanced) != 1:
              raise SystemExit(f'Expected one advanced greedy merge site, found {text.count(old_advanced)}')
          if text.count(old_greedy) != 1:
              raise SystemExit(f'Expected one greedy merge site, found {text.count(old_greedy)}')

          text = text.replace(old_advanced, new_advanced, 1)
          text = text.replace(old_greedy, new_greedy, 1)
          path.write_text(text)
          PY

          git diff --check
          grep -q 'return result;' src/main/java/com/balugaq/netex/utils/InventoryUtil.java
          test "$(grep -c 'public synchronized ItemStack getItemStack()' src/main/java/io/github/sefiraat/networks/network/stackcaches/QuantumCache.java)" -eq 1
          grep -q 'AdvancedGreedyBlock.TEMPLATE_SLOT' src/main/java/io/github/sefiraat/networks/network/NetworkRoot.java
          grep -q 'NetworkGreedyBlock.TEMPLATE_SLOT' src/main/java/io/github/sefiraat/networks/network/NetworkRoot.java

          git rm .github/workflows/refork-repair.yml
          git add \
            src/main/java/com/balugaq/netex/utils/InventoryUtil.java \
            src/main/java/io/github/sefiraat/networks/network/stackcaches/QuantumCache.java \
            src/main/java/io/github/sefiraat/networks/network/NetworkRoot.java
          git commit -m "fix(refork): resolve upstream merge compile artifacts"
          git push origin HEAD:refork-merge
