name: Format Quantum Storage capacity display fix

on:
  push:
    branches:
      - fix/quantum-capacity-display

permissions:
  contents: write

jobs:
  format-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/quantum-capacity-display

      - name: Correct Java indentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/main/java/io/github/sefiraat/networks/slimefun/network/NetworkQuantumStorage.java')
          text = path.read_text(encoding='utf-8')
          old = '\n'.join([
              '            lore.add(String.format(',
              '    Lang.getString("displays.quantum_storage.stored_amount"),',
              '    String.format("%,d / %,d", cache.getAmountLong(), cache.getLimitLong())));',
          ])
          new = '\n'.join([
              '            lore.add(String.format(',
              '                Lang.getString("displays.quantum_storage.stored_amount"),',
              '                String.format("%,d / %,d", cache.getAmountLong(), cache.getLimitLong())));',
          ])

          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one unformatted amount/capacity block, found {text.count(old)}')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove one-shot workflow and commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-quantum-capacity-display.yml
          git add src/main/java/io/github/sefiraat/networks/slimefun/network/NetworkQuantumStorage.java
          git commit -m "Format Quantum Storage capacity display"
          git push origin HEAD:fix/quantum-capacity-display
