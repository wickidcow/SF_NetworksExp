name: Apply 1.1.0 unloaded data guard

on:
  push:
    branches:
      - networks-1.1.0-fork-fixes
    paths:
      - '.github/workflows/apply-1.1.0-unloaded-data-guard.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: networks-1.1.0-fork-fixes

      - name: Apply unloaded block-data guards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected source block not found in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/main/java/com/ytdd9527/networksexpansion/core/items/machines/AdvancedDirectional.java',
              '''            public void newInstance(@NotNull BlockMenu blockMenu, @NotNull Block b) {\n                final BlockFace direction;''',
              '''            public void newInstance(@NotNull BlockMenu blockMenu, @NotNull Block b) {\n                final SlimefunBlockData blockData = StorageCacheUtils.getBlock(blockMenu.getLocation());\n                if (blockData == null || !blockData.isDataLoaded()) {\n                    return;\n                }\n\n                final BlockFace direction;''')

          replace_once(
              'src/main/java/com/ytdd9527/networksexpansion/implementation/machines/networks/advanced/AdvancedWirelessTransmitter.java',
              '''import com.balugaq.netex.utils.Lang;\nimport com.xzavier0722.mc.plugin.slimefun4.storage.util.StorageCacheUtils;''',
              '''import com.balugaq.netex.utils.Lang;\nimport com.xzavier0722.mc.plugin.slimefun4.storage.controller.SlimefunBlockData;\nimport com.xzavier0722.mc.plugin.slimefun4.storage.util.StorageCacheUtils;''')

          replace_once(
              'src/main/java/com/ytdd9527/networksexpansion/implementation/machines/networks/advanced/AdvancedWirelessTransmitter.java',
              '''            public void newInstance(@NotNull BlockMenu blockMenu, @NotNull Block b) {\n                final Location location = blockMenu.getLocation();\n\n                final String rawLimit = StorageCacheUtils.getData(location, LIMIT_KEY);''',
              '''            public void newInstance(@NotNull BlockMenu blockMenu, @NotNull Block b) {\n                final Location location = blockMenu.getLocation();\n                final SlimefunBlockData blockData = StorageCacheUtils.getBlock(location);\n                if (blockData == null || !blockData.isDataLoaded()) {\n                    return;\n                }\n\n                final String rawLimit = StorageCacheUtils.getData(location, LIMIT_KEY);''')

          replace_once(
              'src/main/java/com/ytdd9527/networksexpansion/implementation/machines/unit/NetworksDrawer.java',
              '''            public void newInstance(@NotNull BlockMenu menu, @NotNull Block b) {\n                Location l = b.getLocation();\n                requestData(l, getContainerId(l));\n                // Restore mode\n                SlimefunBlockData blockData = StorageCacheUtils.getBlock(l);\n                String lock = null;''',
              '''            public void newInstance(@NotNull BlockMenu menu, @NotNull Block b) {\n                Location l = b.getLocation();\n                SlimefunBlockData blockData = StorageCacheUtils.getBlock(l);\n                if (blockData == null || !blockData.isDataLoaded()) {\n                    return;\n                }\n\n                requestData(l, getContainerId(l));\n                // Restore mode\n                String lock = null;''')

          replace_once(
              'src/main/java/io/github/sefiraat/networks/slimefun/network/NetworkDirectional.java',
              '''            public void newInstance(@NotNull BlockMenu blockMenu, @NotNull Block b) {\n                final BlockFace direction;''',
              '''            public void newInstance(@NotNull BlockMenu blockMenu, @NotNull Block b) {\n                final SlimefunBlockData blockData = StorageCacheUtils.getBlock(blockMenu.getLocation());\n                if (blockData == null || !blockData.isDataLoaded()) {\n                    return;\n                }\n\n                final BlockFace direction;''')
          PY

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-1.1.0-unloaded-data-guard.yml
          git config user.name 'wickidcow'
          git config user.email '185013218+wickidcow@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(1.1.0): guard unloaded Slimefun block data'
          git push origin HEAD:networks-1.1.0-fork-fixes
