name: Apply upstream dupe hardening

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/apply-upstream-dupe-hardening.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply selective upstream hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_all(path: Path, old: str, new: str, minimum: int) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f'{path}: expected at least {minimum} occurrences of {old!r}, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          def method_end(text: str, open_brace: int) -> int:
              depth = 0
              i = open_brace
              state = 'code'
              while i < len(text):
                  ch = text[i]
                  nxt = text[i + 1] if i + 1 < len(text) else ''
                  if state == 'code':
                      if ch == '/' and nxt == '/':
                          state = 'line_comment'
                          i += 2
                          continue
                      if ch == '/' and nxt == '*':
                          state = 'block_comment'
                          i += 2
                          continue
                      if ch == '"':
                          state = 'string'
                      elif ch == "'":
                          state = 'char'
                      elif ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              return i
                  elif state == 'line_comment':
                      if ch == '\n':
                          state = 'code'
                  elif state == 'block_comment':
                      if ch == '*' and nxt == '/':
                          state = 'code'
                          i += 2
                          continue
                  elif state == 'string':
                      if ch == '\\':
                          i += 2
                          continue
                      if ch == '"':
                          state = 'code'
                  elif state == 'char':
                      if ch == '\\':
                          i += 2
                          continue
                      if ch == "'":
                          state = 'code'
                  i += 1
              raise SystemExit('Could not find Java method closing brace')

          def wrap_method_with_cache_lock(path: Path, signature: str) -> None:
              text = path.read_text(encoding='utf-8')
              start = text.find(signature)
              if start < 0:
                  raise SystemExit(f'{path}: method signature not found: {signature}')
              open_brace = text.find('{', start + len(signature))
              if open_brace < 0:
                  raise SystemExit(f'{path}: method opening brace not found')
              end = method_end(text, open_brace)
              body = text[open_brace + 1:end]
              if 'synchronized (cache)' in body:
                  return
              lines = body.strip('\n').rstrip().splitlines()
              indented = '\n'.join(('    ' + line if line.strip() else line) for line in lines)
              wrapped = '{\n        synchronized (cache) {\n' + indented + '\n        }\n    '
              path.write_text(text[:open_brace] + wrapped + text[end:], encoding='utf-8')

          nqs = Path('src/main/java/io/github/sefiraat/networks/slimefun/network/NetworkQuantumStorage.java')
          wrap_method_with_cache_lock(
              nqs,
              'public static ItemStack getItemStack(@NotNull QuantumCache cache, @NotNull BlockMenu blockMenu, int amount)'
          )

          drawer = Path('src/main/java/com/ytdd9527/networksexpansion/implementation/machines/unit/NetworksDrawer.java')
          replace_once(
              drawer,
              '    private static void quickTransfer(\n',
              '    private static synchronized void quickTransfer(\n'
          )

          storage = Path('src/main/java/com/balugaq/netex/api/data/StorageUnitData.java')
          for old, new in (
              ('    public void removeItem(int itemId) {', '    public synchronized void removeItem(int itemId) {'),
              ('    public void setItemAmount(int itemId, int amount) {', '    public synchronized void setItemAmount(int itemId, int amount) {'),
              ('    public void removeAmount(int itemId, int amount) {', '    public synchronized void removeAmount(int itemId, int amount) {'),
              ('    public void depositItemStacks0(\n', '    public synchronized void depositItemStacks0(\n'),
          ):
              replace_once(storage, old, new)
          replace_all(
              storage,
              '    public void depositItemStack0(',
              '    public synchronized void depositItemStack0(',
              5
          )

          quantum = Path('src/main/java/io/github/sefiraat/networks/network/stackcaches/QuantumCache.java')
          qtext = quantum.read_text(encoding='utf-8')
          required = (
              'public synchronized ItemStack getItemStack()',
              'public synchronized void setItemStack(@Nullable ItemStack itemStack)',
              'public synchronized ItemStack withdrawItem(int requested)',
          )
          missing = [token for token in required if token not in qtext]
          if missing:
              raise SystemExit(f'QuantumCache hardening missing before backport: {missing}')

          checks = {
              nqs: ('synchronized (cache)',),
              drawer: ('private static synchronized void quickTransfer(',),
              storage: (
                  'public synchronized void removeItem(int itemId)',
                  'public synchronized void setItemAmount(int itemId, int amount)',
                  'public synchronized void removeAmount(int itemId, int amount)',
                  'public synchronized void depositItemStacks0(',
                  'public synchronized void depositItemStack0(',
                  'public synchronized int addStoredItem0(',
                  'public synchronized ItemStack requestItem0(',
              ),
          }
          for path, tokens in checks.items():
              text = path.read_text(encoding='utf-8')
              missing = [token for token in tokens if token not in text]
              if missing:
                  raise SystemExit(f'{path}: expected hardening markers missing: {missing}')
          PY

      - name: Verify Networks source contract
        run: python3 scripts/verify_legacy_compatibility.py

      - name: Commit selective hardening
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No source changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/main/java/io/github/sefiraat/networks/slimefun/network/NetworkQuantumStorage.java \
            src/main/java/io/github/sefiraat/networks/network/stackcaches/QuantumCache.java \
            src/main/java/com/balugaq/netex/api/data/StorageUnitData.java \
            src/main/java/com/ytdd9527/networksexpansion/implementation/machines/unit/NetworksDrawer.java
          git commit -m 'Backport upstream quantum storage dupe hardening'
          git push origin HEAD:master
