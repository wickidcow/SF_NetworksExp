name: Apply Phase 2 audit patch

on:
  push:
    branches:
      - audit/server-scale-phase1
    paths:
      - .github/workflows/audit-phase2-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add temporary Phase 2 audit patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/server-scale-phase1
          fetch-depth: 0

      - name: Apply lazy storage-view and grid lifecycle patch
        shell: python
        run: |
          from pathlib import Path

          root_path = Path('src/main/java/io/github/sefiraat/networks/network/NetworkRoot.java')
          root = root_path.read_text()
          old = '''    public boolean refreshRootItems() {
              this.barrels = null;
              this.cargoStorageUnitDatas = null;
              this.inputAbleBarrels = null;
              this.outputAbleBarrels = null;
              this.inputAbleCargoStorageUnitDatas = null;
              this.outputAbleCargoStorageUnitDatas = null;
              this.mapInputAbleBarrels = null;
              this.mapOutputAbleBarrels = null;
              this.mapInputAbleCargoStorageUnits = null;
              this.mapOutputAbleCargoStorageUnits = null;
              this.allItemsView = null;
          
              getBarrels();
              getCargoStorageUnitDatas();
              getInputAbleBarrels();
              getOutputAbleBarrels();
              getInputAbleCargoStorageUnitDatas();
              getOutputAbleCargoStorageUnitDatas();
              return true;
          }
          '''.replace('      ', '')
          new = '''    /**
           * Invalidates storage-derived views without immediately rescanning every monitor. The next real storage
           * operation rebuilds only the view it needs, matching a freshly-created root's lazy behavior.
           */
          public void invalidateRootItems() {
              this.barrels = null;
              this.cargoStorageUnitDatas = null;
              this.inputAbleBarrels = null;
              this.outputAbleBarrels = null;
              this.inputAbleCargoStorageUnitDatas = null;
              this.outputAbleCargoStorageUnitDatas = null;
              this.mapInputAbleBarrels = null;
              this.mapOutputAbleBarrels = null;
              this.mapInputAbleCargoStorageUnits = null;
              this.mapOutputAbleCargoStorageUnits = null;
              this.allItemsView = null;
          }
          
          public boolean refreshRootItems() {
              invalidateRootItems();
          
              getBarrels();
              getCargoStorageUnitDatas();
              getInputAbleBarrels();
              getOutputAbleBarrels();
              getInputAbleCargoStorageUnitDatas();
              getOutputAbleCargoStorageUnitDatas();
              return true;
          }
          '''.replace('      ', '')
          if old not in root:
              raise SystemExit('NetworkRoot refreshRootItems block did not match')
          root_path.write_text(root.replace(old, new, 1))

          controller_path = Path('src/main/java/io/github/sefiraat/networks/slimefun/network/NetworkController.java')
          controller = controller_path.read_text()
          old = '        root.refreshRootItems();\n'
          new = '''        // Match a freshly-created root: discard derived storage snapshots now, but rebuild them lazily
          // only when a transport/grid operation actually needs that view.
          root.invalidateRootItems();
          '''.replace('      ', '')
          if controller.count(old) != 1:
              raise SystemExit(f'Expected one stable-root refresh call, found {controller.count(old)}')
          controller_path.write_text(controller.replace(old, new, 1))

          grid_path = Path('src/main/java/io/github/sefiraat/networks/slimefun/network/grid/AbstractGrid.java')
          grid = grid_path.read_text()
          import_anchor = 'import org.bukkit.entity.Player;\n'
          if 'import org.bukkit.event.block.BlockBreakEvent;' not in grid:
              if import_anchor not in grid:
                  raise SystemExit('AbstractGrid import anchor missing')
              grid = grid.replace(import_anchor, import_anchor + 'import org.bukkit.event.block.BlockBreakEvent;\n', 1)

          method_anchor = '''    @Override
          public void postRegister() {
              getPreset();
          }
          '''.replace('      ', '')
          method = '''    @Override
          protected void postBreak(@NotNull BlockBreakEvent event) {
              super.postBreak(event);
              getCacheMap().remove(event.getBlock().getLocation());
          }
          
          @Override
          public void postRegister() {
              getPreset();
          }
          '''.replace('      ', '')
          if method_anchor not in grid:
              raise SystemExit('AbstractGrid postRegister anchor missing')
          grid_path.write_text(grid.replace(method_anchor, method, 1))

          audit_path = Path('SERVER_SCALE_AUDIT.md')
          audit = audit_path.read_text()
          marker = '### Phase 2 — storage lookup and grid/crafting paths\n\n'
          addition = '''### Phase 2 — storage lookup and grid/crafting paths
          
          **First implementation slice:** unchanged controller ticks now invalidate derived storage views without eagerly rebuilding every barrel/drawer direction set. The next real transport/grid request rebuilds only the view it needs. `refreshRootItems()` keeps its eager public behavior for explicit callers. Grid runtime caches are also removed when a grid block is broken so old locations cannot retain sorted entry/item history indefinitely.
          
          '''.replace('      ', '')
          if marker not in audit:
              raise SystemExit('Phase 2 audit marker missing')
          audit_path.write_text(audit.replace(marker, addition, 1))

      - name: Commit audit patch and remove temporary workflow
        run: |
          git config user.name wickidcow
          git config user.email jaywago@gmail.com
          git rm .github/workflows/audit-phase2-patch.yml
          git add SERVER_SCALE_AUDIT.md \
            src/main/java/io/github/sefiraat/networks/network/NetworkRoot.java \
            src/main/java/io/github/sefiraat/networks/slimefun/network/NetworkController.java \
            src/main/java/io/github/sefiraat/networks/slimefun/network/grid/AbstractGrid.java
          git commit -m "Make stable storage views lazy and clean grid caches"
          git push origin HEAD:audit/server-scale-phase1
