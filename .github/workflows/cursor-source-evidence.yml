name: Cursor regression source evidence

# Temporary, read-only development evidence for reproducing the cursor fault.
# It never changes the repository, publishes a release, or connects to a server.
on:
  push:
    branches: [security/cursor-callback-conservation-20261017]

permissions:
  contents: read

jobs:
  retain-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Retain the exact tracked source and identity for local review
        run: |
          git rev-parse HEAD > cursor-source-revision.txt
          git archive --format=tar HEAD > cursor-source.tar
          sha256sum cursor-source.tar > cursor-source.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: cursor-regression-source-evidence
          path: |
            cursor-source.tar
            cursor-source.sha256
            cursor-source-revision.txt
          retention-days: 7
          if-no-files-found: error
