name: Refork Merge Cleanup

on:
  push:
    branches:
      - refork-merge
    paths:
      - '.github/workflows/refork-merge.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: refork-merge
          fetch-depth: 0

      - name: Clean merged upstream artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 - <<'PY'
          from pathlib import Path

          stack = Path('src/main/java/io/github/sefiraat/networks/utils/StackUtils.java')
          text = stack.read_text()
          if 'import java.util.List;' not in text:
              text = text.replace('import java.util.Map;', 'import java.util.List;\nimport java.util.Map;')
          stack.write_text(text)

          gradle = Path('build.gradle.kts')
          lines = gradle.read_text().splitlines(keepends=True)
          out = []
          i = 0
          while i < len(lines):
              if lines[i].startswith('    runServer {'):
                  depth = 0
                  while i < len(lines):
                      depth += lines[i].count('{') - lines[i].count('}')
                      i += 1
                      if depth == 0:
                          break
                  if out and out[-1].strip() == '':
                      pass
                  continue
              out.append(lines[i])
              i += 1
          gradle.write_text(''.join(out))
          PY

          # These upstream-only files conflict with the Legacy fork's release model/project identity.
          git rm -f .github/workflows/release.yml AGENTS.md

          git diff --check
          grep -q 'import java.util.List;' src/main/java/io/github/sefiraat/networks/utils/StackUtils.java
          if grep -q '^    runServer {' build.gradle.kts; then
            echo 'Unexpected upstream runServer block remains'
            exit 1
          fi

          git add src/main/java/io/github/sefiraat/networks/utils/StackUtils.java build.gradle.kts
          git commit -m "chore(refork): clean upstream merge artifacts"
          git push origin HEAD:refork-merge
