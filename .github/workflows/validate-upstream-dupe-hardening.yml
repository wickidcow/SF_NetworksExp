name: Validate upstream dupe hardening

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/validate-upstream-dupe-hardening.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Networks
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check out Slimefun Legacy
        uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: master
          path: .ci/slimefun-core

      - name: Set up Java 25 for Slimefun Legacy
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Verify Networks source contract
        run: python3 scripts/verify_legacy_compatibility.py

      - name: Build exact Slimefun Legacy JAR
        shell: bash
        run: bash scripts/build_slimefun_core.sh .ci/slimefun-core legacy

      - name: Locate exact Slimefun Legacy JAR
        shell: bash
        run: |
          CORE_JAR="$(python3 scripts/find_slimefun_jar.py .ci/slimefun-core)"
          test -f "$CORE_JAR"
          echo "SLIMEFUN_CORE_JAR=$CORE_JAR" >> "$GITHUB_ENV"

      - name: Set up Java 21 for Networks
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Test and compile hardened Networks
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean test shadowJar --no-daemon -PslimefunCoreJar="$SLIMEFUN_CORE_JAR"

      - name: Verify Java 21 bytecode
        shell: bash
        run: |
          NETWORKS_JAR="$(find build/libs -name 'Networks-Legacy-*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$NETWORKS_JAR"
          python3 scripts/verify_java21_bytecode.py "$NETWORKS_JAR"
          python3 scripts/verify_universal_jar.py "$NETWORKS_JAR" '2.1.112-Legacy-1.0'

      - name: Record successful validation
        shell: bash
        run: |
          printf 'Validated commit: %s\nSlimefun Legacy: %s\n' \
            "$(git rev-parse HEAD)" \
            "$(git -C .ci/slimefun-core rev-parse HEAD)" > .ci-hardening-validation-success
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci-hardening-validation-success
          git commit -m 'Record quantum hardening validation'
          git push origin HEAD:master
