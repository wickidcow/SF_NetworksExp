name: Networks
authors:
  - Sefiraat
  - balugaq
  - ytdd9527
  - wickidcow
description: A modern Networks continuation for Slimefun Legacy, United, and Gugu.
main: io.github.sefiraat.networks.Networks
website: https://github.com/wickidcow/SF_NetworksExp
version: ${version}
api-version: '1.21'
depend:
  - Slimefun
softdepend:
  - InfinityExpansion
  - FluffyMachines
  - Netheopoiesis
  - SlimeHUD
  - SlimeHUDPlus
  - JustEnoughGuide
  - LogiTech
  - WildChests
  - RoseStacker
  - WildStacker
  - mcMMO
  - GuguSlimefunLib
  - FinalTECH
  - FinalTECH-Changed
commands:
  networks:
    aliases: networksexpansion
    description: Networks administration and diagnostic commands
    usage: The installed Networks build is not compatible with this server. Check the console for details.
permissions:
  networks.admin:
    description: Allows all Networks administration commands
    default: op
  networks.commands.help:
    description: Allows /networks help
    default: op
  networks.commands.fillquantum:
    description: Allows /networks fillquantum
    default: op
  networks.commands.fixblueprint:
    description: Allows /networks fixblueprint
    default: op
  networks.commands.restore:
    description: Allows /networks restore
    default: op
  networks.commands.addstorageitem:
    description: Allows /networks addstorageitem
    default: op
  networks.commands.reducestorageitem:
    description: Allows /networks reducestorageitem
    default: op
  networks.commands.setquantum:
    description: Allows /networks setquantum
    default: op
  networks.commands.setcontainerid:
    description: Allows /networks setcontainerid
    default: op
  networks.commands.updateitem:
    description: Allows /networks updateitem
    default: op
  networks.commands.findcachedstorages:
    description: Allows /networks findcachedstorages
    default: op
  networks.commands.getstorageitem:
    description: Allows /networks getstorageitem
    default: op
  networks.commands.map:
    description: Allows /networks map
    default: op
  networks.commands.doctor:
    description: Allows Networks runtime integrity scans and repairs
    default: op
