    help:
    - '&6Networks command help:'
    - '&6/networks help - Show this help message.'
    - '&6/networks fillquantum <amount> - Set the amount stored in the Quantum Storage held in your hand.'
    - '&6/networks fixblueprint <keyInMeta> - Repair the Crafting Blueprint held in your hand.'
    - '&6/networks addstorageitem <amount> - Add the held item to the Network Drawer you are looking at.'
    - '&6/networks reducestorageitem <amount> - Remove items from the Network Drawer you are looking at.'
    - '&6/networks setquantum <amount> - Set the item and amount in the Quantum Storage you are looking at.'
    - '&6/networks setcontainerid <containerId> - Set a Network Drawer''s container ID.'
    - '&6/networks updateitem - Update the item held in your hand.'
    - '&6/networks getstorageitem <slot> - Get an item from a slot in the Network Drawer you are looking at.'
    - '&6/networks viewlog - View diagnostic output from the AdminDebuggable block you are looking at.'
    example:
      help:
      - '&6/networks help - Show command help.'
      - '&6ex: /networks help'
      fillquantum:
      - '&6/networks fillQuantum <amount> - Set the held Quantum Storage amount.'
      - '&6ex: /networks fillQuantum 1000'
      fixblueprint:
      - '&6/networks fixBlueprint <keyInMeta> - Repair the held Crafting Blueprint.'
      - '&6ex: /networks fixBlueprint networks-changed'
      addstorageitem:
      - '&6/networks addStorageItem <amount> - Add held items to the targeted Network Drawer.'
      - '&6ex: /networks addstorageItem 1000'
      reducestorageitem:
      - '&6/networks reduceStorageItem <amount> - Remove items from the targeted Network Drawer.'
      - '&6ex: /networks reduceStorageItem 1000'
      setquantum:
      - '&6/networks setQuantum <amount> - Set the targeted Quantum Storage item and amount.'
      - '&6ex: /networks setQuantum 1000'
      setcontainerid:
      - '&6/networks setContainerId <containerId> - Set the targeted Network Drawer''s ID.'
      - '&6ex: /networks setContainerId 6'
      getstorageitem:
      - '&6/networks getStorageItem <slot> - Get an item from the targeted Network Drawer.'
      - '&6ex: /networks getStorageItem 0'
      updateitem:
      - '&6/networks updateItem - Update the held item.'
      - '&6ex: /networks updateItem'
      viewlog:
      - '&6/networks viewLog - View diagnostic output from the targeted block.'
      - '&6ex: /networks viewLog'
      unknown-command:
      - <error>Unknown command. Use /networks help for assistance.
