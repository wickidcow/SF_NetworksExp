    lore:
    - An advanced construct able to make
    - big things go small.
  NTW_SIMPLE_NANOBOTS:
    name: Simple Nanobots
    lore:
    - Teeny tiny little bots that can
    - help you with precise tasks.
  NTW_ADVANCED_NANOBOTS:
    name: Advanced Nanobots
    lore:
    - Teeny tiny little bots that can
    - help you with precise tasks.
    - This version is smarter and faster.
  NTW_AI_CORE:
    name: A.I. Core
    lore:
    - A burgeoning artificial intelligence
    - resides within this weak shell.
  NTW_EMPOWERED_AI_CORE:
    name: Empowered A.I. Core
    lore:
    - A flourishing artificial intelligence
    - resides within this shell.
  NTW_PRISTINE_AI_CORE:
    name: Pristine A.I. Core
    lore:
    - A perfected artificial intelligence
    - resides within this defined shell.
  NTW_INTERDIMENSIONAL_PRESENCE:
    name: Interdimensional Presence
    lore:
    - An artificial intelligence that has
    - grown too powerful for just a
    - single dimension.
  NTW_CONTROLLER:
    name: Network Controller
    lore:
    - The Network Controller is the brain
    - for the whole network. Max 1 per network.
  NTW_BRIDGE:
    name: Network Bridge
    lore:
    - The bridge allows you to cheaply
    - connect network objects together.
  NTW_MONITOR:
    name: Network Monitor
    lore:
    - Allows the network to interact with
    - an adjacent supported inventory.
    - ''
    - Supports Network Shells and compatible
    - addon storage implementations.
  NTW_IMPORT:
    name: Network Importer
    lore:
    - Moves items placed inside it into
    - the network, up to 9 stacks per
    - Slimefun tick.
    - Accepts items from Cargo.
  NTW_EXPORT:
    name: Network Exporter
    lore:
    - Can be configured to constantly
    - export one stack of a chosen item.
    - Its inventory can be accessed by Cargo.
  NTW_GRABBER:
    name: Network Grabber
    lore:
    - Tries to grab the first available
    - item from the selected Slimefun machine.
  NTW_PUSHER:
    name: Network Pusher
    lore:
    - Tries to push a matching item from
    - the network into the selected machine.
  NTW_MOREPUSHER:
    name: Network Pusher (Enhanced)
    lore:
    - Pushes matching items from the network
    - into the selected machine at a higher rate.
  NTW_BESTPUSHER:
    name: Network Pusher (Ultimate)
    lore:
    - Pushes matching items from the network
    - into the selected machine at the best rate.
  NTW_CONTROL_X:
    name: 'Network Control: X'
    lore:
    - Cuts a supported vanilla block out
    - of the world and stores it in the network.
    - Only works on blocks without inventories.
  NTW_CONTROL_V:
    name: 'Network Control: V'
    lore:
    - Pastes a stored vanilla block from
    - the network back into the world.
  NTW_VACUUM:
    name: Network Vacuum
    lore:
    - Collects nearby dropped items and
    - tries to insert them into the network.
  NTW_VANILLA_GRABBER:
    name: Network Vanilla Grabber
    lore:
    - Pulls the first available item from
    - the selected vanilla inventory.
  NTW_VANILLA_PUSHER:
    name: Network Vanilla Pusher
    lore:
    - Pushes items supplied to this node
    - into the selected vanilla inventory.
